<script>
  async function loadSignals() {
    try {
      const response = await fetch('./data/signals.json');
      const data = await response.json();
      
      console.log("Dernière mise à jour :", data.last_updated);
      
      const container = document.getElementById('signals-container'); // Remplacez par l'ID de votre conteneur HTML
      if (!container) return;
      
      container.innerHTML = ''; // Vider le contenu précédent
      
      data.signals.forEach(signal => {
        const badgeColor = signal.type === 'BUY' ? 'green' : 'red';
        const card = `
          <div class="signal-card" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px;">
            <h3>${signal.pair} - <span style="color: ${badgeColor};">${signal.type}</span></h3>
            <p><strong>Prix d'entrée :</strong> ${signal.entry_price}</p>
            <p><strong>Take Profit (TP) :</strong> ${signal.target_tp}</p>
            <p><strong>Stop Loss (SL) :</strong> ${signal.stop_loss}</p>
            <small>Mis à jour : ${signal.timestamp}</small>
          </div>
        `;
        container.innerHTML += card;
      });
    } catch (error) {
      console.error("Erreur lors du chargement des signaux :", error);
    }
  }

  // Charger au chargement de la page
  document.addEventListener('DOMContentLoaded', loadSignals);
</script>
